    <meta name="apple-mobile-web-app-title" content="Seaglass" />
    <title>Seaglass</title>
    <script>
      // Pick the theme before anything draws, so the boot screen (and the first paint) is already light or dark.
      try { var t = localStorage.getItem("sg.theme") || "system"; if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      /* Boot screen: the two pieces of sea glass wash in and settle, the overlap deepens, the glint catches, then the
         app fades in over it (src/client/boot.ts). The mark is drawn by npm run icons from src/client/logo.ts. */
      #boot { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-content: center; justify-items: center; gap: 16px; padding-bottom: 7vh; background: #fff; color: #2c2c2b; transition: opacity .3s ease, visibility 0s linear .3s; animation: boot-giveup .3s ease 9s forwards; }
      :root[data-theme="dark"] #boot { background: #191919; color: #f0efed; }
      #boot.out { opacity: 0; visibility: hidden; }
      .boot-mark { width: 92px; height: 92px; overflow: visible; transition: transform .3s cubic-bezier(.3, 0, .2, 1); }
      #boot.out .boot-mark { transform: scale(1.07); }
      .boot-mark g, .boot-mark path { transform-box: fill-box; transform-origin: center; }
      .boot-mark .lg-back { animation: boot-back .64s cubic-bezier(.2, .85, .25, 1.14) .05s both; }
      .boot-mark .lg-front { animation: boot-front .68s cubic-bezier(.2, .85, .25, 1.14) .16s both; }
      .boot-mark .lg-overlap { animation: boot-fade .28s ease-out .64s both; }
      .boot-mark .lg-glint { stroke-dasharray: 11; animation: boot-glint .34s cubic-bezier(.3, 0, .2, 1) .78s both; }
      .boot-name { font: 650 21px/1 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -.012em; animation: boot-name .5s cubic-bezier(.2, .8, .2, 1) .72s both; }
      @keyframes boot-back { from { opacity: 0; transform: translate(10px, -12px) rotate(16deg) scale(.9); } 45% { opacity: 1; } to { opacity: 1; transform: none; } }
      @keyframes boot-front { from { opacity: 0; transform: translate(-11px, 13px) rotate(-14deg) scale(.9); } 45% { opacity: 1; } to { opacity: 1; transform: none; } }
      @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-glint { from { stroke-dashoffset: 11; opacity: 0; } 30% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes boot-name { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes boot-giveup { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; transition: none !important; } }
    </style>
  </head>
